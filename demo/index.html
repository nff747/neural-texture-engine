<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NTE - Live Browser Demo</title>
  <style>
    body { background: #000; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { color: #f0f; }
    .container { display: flex; gap: 20px; margin-top: 20px; }
    .box { display: flex; flex-direction: column; align-items: center; }
    canvas { background: #222; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>Neural Texture Engine Live Demo</h1>
  <p>Live super-resolution applied in the browser</p>
  
  <div class="container">
    <div class="box">
      <h3>Original (Low Res)</h3>
      <canvas id="canvas-low" width="256" height="256"></canvas>
    </div>
    <div class="box">
      <h3>Upscaled (High Res)</h3>
      <canvas id="canvas-high" width="1024" height="1024"></canvas>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "neural-texture-engine": "../dist/index.js"
      }
    }
  </script>
  <script type="module" src="./script.js"></script>
</body>
</html>
